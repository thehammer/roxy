services:
  roxy:
    build: .
    env_file: .env
    environment:
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
    # For local dev against real AWS, mount credentials or use an IAM role
    volumes:
      - ~/.aws:/root/.aws:ro

  # Optional: local DynamoDB for offline dev
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
