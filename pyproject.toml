[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "roxy"
version = "0.1.0"
description = "Slack bot for readwriteexecute — dynamic channel management + LLM agent"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.21",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[dynamodb]>=5.0",
    "ruff>=0.4",
]
infra = [
    "aws-cdk-lib>=2.140",
    "constructs>=10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
